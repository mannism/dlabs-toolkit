name: "@diabolicallabs/llm-client"
purpose: >
  Unified LLM client across 5 providers: OpenAI (Responses API), Anthropic, Gemini
  (@google/genai v2.x), DeepSeek, and Perplexity. Provides a single LlmClient interface
  with complete(), stream(), structured(), withTools(), and streamStructured().
  Provider-neutral multimodal content blocks (v4.2.0+): LlmContentBlock[] in LlmMessage.content
  for images (base64 + URL) and PDFs (base64) — Anthropic full, OpenAI full, Gemini base64 only,
  Perplexity/DeepSeek reject with bad_request. Per-provider mediaInput capability flags.
  Files API (v5.1.0+): LlmFilesApi namespace on every LlmClient — upload/refresh/waitForActive/delete.
  Supports video (Gemini only), large images (Gemini + Anthropic), PDFs (all three).
  { type: 'file', ref: LlmFileRef } content block references uploaded assets in messages.
  Error normalization into 16-kind LlmError taxonomy with retryability and status-code
  classification. Token usage normalization into consistent LlmUsage shape regardless of
  provider. Configurable retry with 4 strategies (exponential, linear, fixed, none).
  Provider failover via model: string[] — tries each model in order on configured error kinds.
  Optional cost tracking via @diabolicallabs/llm-pricing peer dep (LlmClientConfig.pricing).
  Strict structured outputs: OpenAI json_schema, Anthropic tool-use, Gemini responseSchema,
  DeepSeek/Perplexity prompt-fallback. Per-call timeout, AbortSignal, stream stall detection.
  Optional semaphore + rate-limiter via @diabolicallabs/llm-client/pool sub-path.
  Capability matrix (getModelCapabilities) with mediaInput fields. linkedAbortController fan-out
  helper. Pre-call hooks API (LlmHooks) — beforeCall (mutation + short-circuit) and afterCall
  (informational) on all 5 call types. Pluggable logger. Remote pricing table via pricing.remoteUrl.
  Retired-model rejection (2026-08-18+): DeepSeek's deepseek-chat/deepseek-reasoner (retired by
  DeepSeek 2026-07-24, no fallback alias) throw LlmError({ kind: 'bad_request', retryable: false })
  client-side before any SDK call, naming deepseek-v4-flash as the replacement. Reject, not
  auto-remap — deliberate design choice, not left to caller judgment. Absent from the capability
  matrix (getModelCapabilities returns null for both).
  Reasoning-effort passthrough (v6.3.0+): LlmCallOptions.reasoningEffort maps to Anthropic
  output_config.effort, OpenAI reasoning.effort, Gemini thinkingConfig.thinkingLevel (uppercase);
  Perplexity/DeepSeek reject with bad_request before any SDK call. LlmUsage.reasoningTokens
  surfaces the model's reasoning-token spend where reported. reasoningEffort dialect tag added
  to ModelCapabilities.
  Gemini media-resolution knob (v6.7.0+): mediaResolution settable at config
  (LlmClientConfig.mediaResolution), call (LlmCallOptions.mediaResolution), and block
  (LlmContentBlock.mediaResolution on image/document/file) level, block wins over call
  wins over config. Request-level accepts low|medium|high; per-part additionally accepts
  ultra_high. Gemini-only — every other provider ignores the field entirely, not a
  value-set mismatch requiring rejection. Request-level ultra_high has no matching SDK
  enum member and throws bad_request pre-flight; per-part ultra_high is valid on image
  blocks but throws bad_request pre-flight on document blocks (Google documents it as
  image-only). Per-part support is Gemini 3.x only — Gemini 2.5-series models
  (gemini-2.5-pro, gemini-2.5-flash, gemini-2.5-flash-lite) return HTTP 400 for a
  per-part value; request-level still works on 2.5. No runtime model gate — advisory
  only via the new mediaInput.mediaResolution: 'request' | 'part' | null capability
  field. gemini-3.8-flash added to the capability matrix (GA 2026-09-02, same shape as
  gemini-3.7-flash, mediaInput.mediaResolution: 'part').
owner: Sable
status: published

depends_on:
  - name: "@anthropic-ai/sdk"
    version: "^0.115.0"
    why: "Anthropic Claude provider — messages API with streaming and prompt cache support"
  - name: "openai"
    version: "^7.4.0"
    why: "OpenAI Responses API provider; also used by DeepSeek and Perplexity with baseURL override"
  - name: "zod"
    version: "^4.4.3"
    why: "Structured output schema validation. Used in structured() and streamStructured() to parse and validate JSON responses."
  - name: "@google/genai"
    version: "^2.17.0"
    why: "Google Gemini provider — generateContent + streaming via v2.x SDK"
  - name: "deepseek (openai SDK with baseURL override)"
    why: "DeepSeek's API is OpenAI Chat Completions-compatible; uses the openai SDK pointed at api.deepseek.com"
  - name: "perplexity (openai SDK with baseURL override)"
    why: "Perplexity's API is OpenAI-compatible; uses the openai SDK pointed at api.perplexity.ai. Returns web-grounded responses with citation URLs."
  - name: "@diabolicallabs/llm-pricing"
    version: "^1.0.0"
    why: "Optional peer dep — enables per-call cost tracking (LlmClientConfig.pricing). v1.7.0+: pricing.remoteUrl wires fetchRemoteTable() for live pricing with stale-while-revalidate cache."

depended_on_by:
  - name: "@diabolicallabs/agent-sdk"
    how: "agent-sdk wraps LlmClient via instrumentClient() to intercept all calls for cost tracking. LlmClient is a peer dep of agent-sdk, not bundled."
  - name: "GEOAudit"
    how: "Live consumer — on ^6.0.0 as of PR #284. All five providers active in production."
  - name: "brand-compliance-saas"
    how: "Live consumer — on ^6.0.0. BullMQ workers run via tsx (CJS-mode); dynamic import() used as workaround pre-6.1.0. CJS require condition (v6.1.0) is the permanent fix."
  - name: "FitChecker"
    how: "Migration in backlog — replaces lib/llm/providers/openai-provider.ts"
  - name: "Agent Spend Dashboard"
    how: "Born-in-toolkit consumer — installs @diabolicallabs/agent-sdk which wraps llm-client"

exports:
  - "createClient(config: LlmClientConfig): Promise<LlmClient>  — async as of v1.7.0"
  - "createClientFromEnv(provider, model, overrides?): Promise<LlmClient>  — async as of v1.7.0"
  - "LlmError (class)"
  - "LlmErrorKind (type) — 16-kind discriminated union"
  - "LlmToolSchema (type) — discriminated union for LlmTool.inputSchema: { kind:'zod'; schema: ZodType } | { kind:'jsonSchema'; schema: Record<string,unknown>; validate?: fn } (v5.0.0+)"
  - "Types: LlmMessage, LlmClientConfig, LlmCallOptions, LlmUsage, LlmResponse, LlmStreamChunk, LlmStructuredResponse, LlmToolResponse, LlmClient, LlmCost"
  - "RetryConfig, RetryStrategy (types)"
  - "LlmCallType (type) — 'complete' | 'stream' | 'structured' | 'withTools' | 'streamStructured' (v1.5.0+)"
  - "LlmCallContext (type) — context object passed to beforeCall hooks: messages, options, provider, model, callType (v1.5.0+)"
  - "LlmBeforeCallResult (type) — return shape for beforeCall: { messages?, options?, skip? } (v1.5.0+)"
  - "LlmSkipResult (type) — named union for the skip field; all valid response shapes (v1.5.0+)"
  - "LlmAfterCallContext (type) — context passed to afterCall hooks: request, response, usage, error, latencyMs; usage populated for all 5 call types (v1.5.0+, usage field v1.6.0+)"
  - "LlmHooks (type) — { beforeCall?, afterCall? } interface; pass as hooks? on LlmClientConfig (v1.5.0+)"
  - "getModelCapabilities(provider, model): ModelCapabilities | null — provider capability lookup"
  - "ModelCapabilities (type) — capability descriptor including mediaInput: { image: { base64, url }, document: { pdfBase64 }, mediaResolution: 'request' | 'part' | null } (v4.2.0+; mediaResolution field v6.7.0+) and reasoningEffort: 'anthropic-effort' | 'openai-effort' | 'gemini-thinking-level' | null (v6.3.0+)"
  - "LlmReasoningEffort (type) — 'none' | 'minimal' | 'low' | 'medium' | 'high' | 'xhigh' | 'max'; set via LlmCallOptions.reasoningEffort (v6.3.0+)"
  - "CAPABILITIES_VERSIONED_AT (constant) — ISO date of last capability table update"
  - "LlmContentBlock (type) — provider-neutral content block: text | image (base64/url) | document (base64) | file (v5.1.0+) (v4.2.0+); image/document/file blocks carry an optional mediaResolution?: LlmMediaResolution per-part override (Gemini-only, v6.7.0+)"
  - "LlmImageMediaType (type) — 'image/jpeg' | 'image/png' | 'image/gif' | 'image/webp' (v4.2.0+)"
  - "LlmDocumentMediaType (type) — 'application/pdf' (v4.2.0+)"
  - "LlmFileMediaType (type) — video/mp4 | video/quicktime | video/webm | image/* | application/pdf (v5.1.0+)"
  - "LlmFileState (type) — 'processing' | 'active' | 'failed' (v5.1.0+)"
  - "LlmFileRef (interface) — provider-neutral file reference; id, uri, provider, mediaType, sizeBytes, state, expiresAt? (v5.1.0+)"
  - "LlmFilesApi (interface) — upload/refresh/waitForActive/delete namespace on LlmClient.files (v5.1.0+)"
  - "linkedAbortController(parentSignal, opts?): LinkedAbortHandle — fan-out AbortController with optional per-child timeout (v1.4.0+)"
  - "LinkedAbortHandle, LinkedAbortControllerOptions (types)"
  - "withTools() — native tool calling on LlmClient (all providers except Perplexity)"
  - "streamStructured() — async generator: streaming tokens + Zod-validated final output (v1.3.0+)"
  - "@diabolicallabs/llm-client/pool sub-path: createSemaphore, createRateLimiter (v1.2.0+)"

contracts:
  pricing_remote:
    config: "pricing.remoteUrl (string) — URL to fetch a PricingTable JSON. Optional. When omitted, bundled DEFAULT_PRICING_TABLE is used."
    cache_ttl: "pricing.cacheTtlMs (number) — cache TTL in ms. Default: 86400000 (24h). Override per-client."
    precedence: "pricing.table (explicit) > pricing.remoteUrl (remote fetch) > DEFAULT_PRICING_TABLE (bundled)."
    fail_safe: "Remote fetch failure falls back to DEFAULT_PRICING_TABLE silently. pricing_source log indicates actual source."
    init_log: "pricing_source structured log event emitted from createClient() on every init. Fields: event, source, url (when remote)."
    breaking_change: "createClient() and createClientFromEnv() return Promise<LlmClient> as of v1.7.0. All callers must await."
  retry:
    strategy: "exponential backoff with full jitter (default); also linear, fixed, none"
    formula: "delay = random(0, baseDelayMs * 2^attempt)"
    retryable_conditions: ["HTTP 429", "HTTP 502", "HTTP 503", "HTTP 504", "ECONNRESET", "ETIMEDOUT", "timeout"]
    non_retryable_conditions: ["HTTP 400", "HTTP 401", "HTTP 403", "HTTP 404", "cancelled", "stream_stall", "tool_schema_invalid"]
    max_retries_default: 3
  timeout_default_ms: 30000
  cancellation:
    per_call_timeout: "LlmCallOptions.timeoutMs overrides config.timeoutMs per attempt"
    caller_signal: "LlmCallOptions.signal — pre-abort throws immediately; mid-call abort kind:'cancelled', not retried"
    stream_stall: "LlmCallOptions.streamStallTimeoutMs (default 30000ms) — fires per chunk, resets on each yield"
    gemini_caveat: "Promise.race only — SDK HTTP request not cancelled. Backstop: httpOptions.timeout = configMs * 2"
  response_ids:
    anthropic: "provider-issued message ID (response.id)"
    openai: "provider-issued response ID (rawResponse.id — Responses API)"
    deepseek: "provider-issued response ID (rawResponse.id — Chat Completions)"
    perplexity: "provider-issued response ID (response.id)"
    gemini: "toolkit-synthesized UUID v7-style (time-derived prefix + random) — Gemini does not issue native IDs"

failure_modes:
  - trigger: "All retries exhausted"
    impact: "Throws LlmError with retryable: false"
    propagation: "propagated — caller must handle"
  - trigger: "Provider API key invalid (HTTP 401/403)"
    impact: "Throws LlmError immediately, no retry"
    propagation: "propagated — caller must handle"
  - trigger: "Per-call timeout fires"
    impact: "Throws LlmError kind:'timeout', retryable:true. Each retry gets a fresh deadline."
    propagation: "propagated after all retries exhausted"
  - trigger: "Caller signal aborted"
    impact: "Throws LlmError kind:'cancelled', retryable:false. Never retried."
    propagation: "propagated immediately"
  - trigger: "Stream stall (no chunk within streamStallTimeoutMs)"
    impact: "Throws LlmError kind:'stream_stall', retryable:true. Stream is never retried mid-stream."
    propagation: "propagated — partial output is lost, caller must decide recovery"
  - trigger: "Provider SDK breaking change"
    impact: "Build failure in @diabolicallabs/llm-client; other packages unaffected"
    propagation: "contained to this package"
  - trigger: "Model failover — all models in array exhausted"
    impact: "Throws LlmError from the last attempted model"
    propagation: "propagated after all models tried"
  - trigger: "reasoningEffort set to a value unsupported by the resolved provider (v6.3.0+)"
    impact: "Throws LlmError kind:'bad_request', retryable:false, before any SDK call. Also thrown for any reasoningEffort value at all on Perplexity/DeepSeek."
    propagation: "propagated immediately — no retry, no partial request sent"
  - trigger: "reasoningEffort set against a non-reasoning OpenAI model (e.g. gpt-4.1) (v6.3.0+)"
    impact: "OpenAI returns HTTP 400; normalizes to LlmError kind:'bad_request' via the existing error path. No internal pre-call capability check — deliberate, see manifest notes."
    propagation: "propagated after the live API call, not pre-flight"

performance:
  expected_latency: "Passthrough to provider — no overhead beyond retry logic"
  notes: "Token counting is done from the provider response, not via tiktoken. No sync-heavy computation."

notes: |
  v6.8.0 (minor — additive, PR #287): added gpt-6-astra (contextWindow
          1,050,000, maxOutputTokens 128,000; reasoning model, image+text input, text
          output — same shape as gpt-5.6-sol) and claude-fable-5-1 (contextWindow
          1,000,000, maxOutputTokens 128,000 — mirrors claude-fable-5's shape exactly,
          no new schema fields introduced) to the capability matrix. CAPABILITIES_VERSIONED_AT
          remains '2026-09-05' (already bumped same-day by PR #283). No claude-mythos-5-1
          row added — claude-mythos-5 has never had a capability-matrix entry either.
  v6.7.0 (minor — additive, PR #283): Gemini mediaResolution — request-level
          (LlmClientConfig.mediaResolution / LlmCallOptions.mediaResolution: low|medium|high)
          and per-part (LlmContentBlock.mediaResolution on image/document/file:
          low|medium|high|ultra_high), block > call > config precedence. New module
          providers/media-resolution.ts. Gemini-only — other providers ignore the field.
          Request-level ultra_high and document+ultra_high throw bad_request pre-flight;
          per-part is Gemini 3.x only (Gemini 2.5-series returns HTTP 400). New additive
          capability field ModelCapabilities.mediaInput.mediaResolution: 'request' | 'part'
          | null — advisory only, no runtime model gate. Adds gemini-3.8-flash to the
          capability matrix (GA 2026-09-02, same shape as gemini-3.7-flash). README and
          LlmClientConfig.timeoutMs JSDoc now document that multimodal (document/file
          block) and reasoningEffort calls commonly need timeoutMs >= 90_000.
  v6.6.0 (minor — additive, PR #268): backfilled capability-matrix rows for
          gemini-3.7-flash, gemini-3-flash-preview, and gemini-2.5-flash-lite (pricing
          data existed in llm-pricing but getModelCapabilities() returned null for all
          three). Also removed the phantom gemini-3.1-pro row (never a real GA model —
          only gemini-3.1-pro-preview exists).
  v6.3.0 (minor — additive): reasoning-effort passthrough. New LlmCallOptions.reasoningEffort
          field (LlmReasoningEffort: 'none'|'minimal'|'low'|'medium'|'high'|'xhigh'|'max').
          New module providers/reasoning-effort.ts: resolveReasoningEffort() (Anthropic/OpenAI/
          Gemini — maps to provider-native wire value, Gemini uppercased) and
          assertReasoningEffortUnsupported() (Perplexity/DeepSeek — always rejects). Anthropic
          merges into output_config (never overwrites .format) at all 5 call-type sites; OpenAI
          merges into reasoning at all 6 sites incl. structuredPromptFallback and withTools;
          Gemini merges into thinkingConfig at all 5 sites. LlmUsage.reasoningTokens added —
          sourced from output_tokens_details.thinking_tokens (Anthropic) / .reasoning_tokens
          (OpenAI); both providers route non-streaming and streaming finalUsage through the same
          normalizeUsage() function, so one change covers both paths. ModelCapabilities gained a
          reasoningEffort dialect tag (not a value-set enum) — cross-reference against
          reasoning-effort.ts's exported value sets. New capability rows: claude-opus-5
          (anthropic-effort), gpt-5.6-sol/terra/luna (openai-effort) — figures verified live
          against provider docs 2026-07-29. Every pre-existing row backfilled with reasoningEffort
          (mostly null; anthropic-effort on opus-4-6/4-7 + sonnet-4-6; openai-effort on
          gpt-5.4/5.4-mini/5.5/5.5-pro/o3/o4-mini; gemini-thinking-level on 3.1-pro-preview/
          3.1-flash-lite/3.5-flash — Gemini 2.5-series uses thinkingBudget, not thinkingLevel, so
          stays null). Unblocks the Labs Effort-Level A/B Harness brief.
  v1.0.0: OpenAI Responses API migration; 14-kind LlmError taxonomy; withTools() for all providers.
  v1.1.0: Optional cost tracking via @diabolicallabs/llm-pricing peer dep.
  v1.2.0: Configurable retry strategies (4 modes); provider failover via model: string[];
          pool sub-path with semaphore + rate-limiter.
  v1.3.0: streamStructured() — async generator: streaming tokens + Zod-validated output.
          Supported providers: OpenAI, Anthropic, DeepSeek (JSON-mode accumulation).
  v1.4.0: getModelCapabilities() capability matrix; linkedAbortController fan-out helper;
          response IDs (id + idSource) on LlmResponse, LlmStructuredResponse, LlmToolResponse.
  v1.5.0: Pre-call hooks API (LlmHooks). beforeCall: mutation + short-circuit. afterCall:
          informational observer. Hooks fire once per method invocation, not per retry.
          wrapWithHooks() is the outermost layer in createClient's wrapping order.
  v1.6.0: LlmAfterCallContext.usage populated for all 5 call types, including streaming paths.
          stream() accumulates usage from the terminal chunk (the chunk that carries chunk.usage).
          streamStructured() captures usage from the done event. For non-streaming paths,
          usage mirrors the response directly. usage is undefined only when the call throws.
  v1.7.0: pricing.remoteUrl — wire fetchRemoteTable() into createClient(); stale-while-revalidate
          cache, 24h TTL, never-throws fail-safe. pricing.cacheTtlMs — override cache TTL.
          createClient() and createClientFromEnv() are now async (Promise<LlmClient>).
          Structured log event pricing_source emitted on init.
  v4.1.0: pluggable setLlmClientLogger(); default = structured JSON to stdout. Six diagnostic
          console.warn sites migrated to event-named logger calls; four stable event names.
  v5.0.0 (BREAKING — PR #154): LlmToolSchema discriminated union replaces the bare
          { parse: fn } shape for LlmTool.inputSchema. Two variants:
          { kind:'zod'; schema: ZodType } — Zod 4 schema; toolkit handles JSON Schema
          conversion and parse() validation automatically.
          { kind:'jsonSchema'; schema: Record<string,unknown>; validate?: fn } — JSON
          Schema passed verbatim to the provider; optional validate() for argument checking.
          Passing the legacy { parse: fn } shape throws LlmError({ kind:'tool_schema_invalid' }),
          retryable: false. New error kind 'tool_schema_invalid' added to LlmErrorKind (now 16
          kinds after stream_stall was added in v0.3.0). LlmToolSchema exported from package root.
  v5.2.0 (minor — PR #171): gemini-3.5-flash registered in capability matrix.
          getModelCapabilities('gemini', 'gemini-3.5-flash') returns full ModelCapabilities
          descriptor. contextWindow: 1_048_576 (2^20), maxOutputTokens: 65_536.
          CAPABILITIES_VERSIONED_AT updated to '2026-06-17'. Smoke-verified: all 3 tests
          (complete/stream/structured) PASS on live GOOGLE_AI_API_KEY (2026-06-17).
  v6.0.0 (phantom major — PR #177): peer-dep cascade from llm-pricing@1.2.0 minor publish
          before cascade guard was in place. No behavioral change. Cascade fix shipped
          same cycle (PR #178): onlyUpdatePeerDependentsWhenOutOfRange + widen peerDep to ^1.0.0.
  v6.1.0 (minor — PRs #179, #180): CJS require exports condition. Adds "require" key to
          exports map for both "." and "./pool" subpaths pointing to the same ESM dist/index.js.
          No dual build — require(esm) is stable on Node >=22.12.0. engines.node raised from
          >=20 to >=22.12.0. Fixes ERR_PACKAGE_PATH_NOT_EXPORTED for CJS-mode runtimes
          (tsx workers, Next.js loaders without serverExternalPackages). Unblocks
          brand-compliance-saas BullMQ workers. 634 tests. 5-provider smoke gate passed.
          INVARIANT: the require condition relies on no top-level await in the module graph.
          A future TLA would cause ERR_REQUIRE_ASYNC_MODULE for CJS consumers.
  v5.1.0 (minor — additive): Files API — LlmFilesApi namespace on LlmClient.files.
          New types: LlmFileMediaType, LlmFileState, LlmFileRef, LlmFilesApi.
          New content block: { type: 'file', ref: LlmFileRef } in LlmContentBlock.
          Gemini: full — video/*/image/*/PDF upload, async state poll (PROCESSING→ACTIVE),
          fileData parts. OpenAI: PDF-only — input_file.file_id; purpose:'user_data' with
          'assistants' fallback. Anthropic: PDF + image/* via Files beta
          (betas: ['files-api-2025-04-14']). DeepSeek/Perplexity: bad_request stubs.
          BlockSupportMatrix extended with fileRef flag. LlmClient.files passthrough in
          wrapWithHooks, wrapWithPricing, createFailoverClient, and agent-sdk instrumentClient.
  v4.2.0 (PR #149, merged 2026-06-06): provider-neutral multimodal content blocks.
          LlmMessage.content widened to string | LlmContentBlock[]. Three new exported types:
          LlmContentBlock, LlmImageMediaType, LlmDocumentMediaType. New internal module
          providers/content-blocks.ts with shared mapper/guard helpers. Anthropic: image+PDF full
          support. OpenAI Responses API: image+PDF full support (filename required on input_file —
          live-verified). Gemini: base64 only (image URL rejects). Perplexity/DeepSeek: reject all
          media with bad_request. mediaInput capability fields added to all model rows.
  Provider SDKs are devDependencies — bundled into dist at build time via tsup.
  Consumers do not need to install provider SDKs directly.
  Published to npmjs.com under @diabolicallabs scope. GEOAudit is the live pilot consumer.
