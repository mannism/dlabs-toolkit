name: "@diabolicallabs/secrets"
purpose: >
  AES-256-GCM encrypt/decrypt for secrets at rest. node:crypto only — zero
  runtime dependencies. Ciphertext format is a self-contained
  "keyVersion:iv:authTag:ciphertext" string, all four segments base64-encoded
  and colon-joined (base64's alphabet excludes ':', making the split safe).
  The keyVersion prefix ("1" in v0.1.0) is bound as GCM additional
  authenticated data, foreclosing version-prefix substitution once a v2
  format exists. masterKey is validated with a bare regex (64-char hex, no
  Zod) — a format-constrained config string read from the deploying app's
  own env var, not an API payload crossing a network boundary.
owner: Sable
status: published

depends_on: []

depended_on_by: []

exports:
  - "createSecretsVault(config: SecretsVaultConfig): SecretsVault"
  - "setSecretsLogger(logger: Logger | null): void"
  - "SecretsError (class) — kind: 'invalid_master_key' | 'decrypt_failed' | 'malformed_ciphertext'"
  - "Types: SecretsVaultConfig, SecretsVault, Logger"

contracts:
  algorithm: "AES-256-GCM via node:crypto createCipheriv/createDecipheriv"
  iv: "randomBytes(12) — fresh 96-bit IV generated per encrypt() call, never reused or derived"
  auth_tag: "128-bit GCM auth tag, verified on every decrypt() call before plaintext is returned"
  aad: "keyVersion prefix bound as additional authenticated data (optional hardening, included in v0.1.0)"
  ciphertext_format: "keyVersion:iv.base64:authTag.base64:ciphertext.base64"

failure_modes:
  - trigger: "masterKey missing, wrong length, or not valid hex"
    impact: "createSecretsVault() throws SecretsError(kind: 'invalid_master_key') — fails fast at construction, before any encrypt/decrypt call"
    propagation: "propagated — caller must handle at startup"
  - trigger: "decrypt() called with a ciphertext string not in the keyVersion:iv:authTag:ciphertext format"
    impact: "throws SecretsError(kind: 'malformed_ciphertext') — never an unhandled exception or crash"
    propagation: "propagated; SECRETS_MALFORMED_CIPHERTEXT logged (event name + reason only, never key/plaintext/ciphertext material)"
  - trigger: "decrypt() called with the wrong master key, or a tampered/truncated ciphertext"
    impact: "GCM auth tag verification fails inside node:crypto; caught and re-thrown as SecretsError(kind: 'decrypt_failed') — never silently returns garbage or an empty string as if it succeeded"
    propagation: "propagated; SECRETS_DECRYPT_FAILED logged (event name + reason only)"

performance:
  expected_latency: "sub-millisecond per encrypt()/decrypt() call — synchronous node:crypto AES-NI-accelerated GCM, no I/O"
  notes: "Both methods are synchronous. Safe to call in a hot path; no batching or pooling needed."

notes: |
  v0.1.0: initial implementation. Out of scope for v0.1.0 (see brief-secrets-package.md):
  key rotation logic (only the keyVersion prefix ships, not a rotation
  mechanism), pluggable storage backend (consumers own their own DB storage
  of the resulting ciphertext string), KMS/HSM integration, multi-tenant key
  hierarchies. Motivating consumer: brand-compliance-saas "Manage Providers"
  admin feature (encryption-at-rest for stored AI-provider API keys) — not
  yet integrated as of this package's initial publish; depended_on_by left
  empty until that integration lands.
