name: "@diabolicallabs/llm-pricing"
purpose: >
  Pricing table + cost computation for @diabolicallabs/llm-client. Converts LlmUsage token counts
  to USD cost breakdowns across all five supported providers. Ships a bundled DEFAULT_PRICING_TABLE
  (offline fallback, always available) plus an opt-in fetchRemoteTable() helper for live pricing
  via a remote URL (stale-while-revalidate cache, 24h TTL, never-throws fail-safe). The canonical
  remote source is pricing/table.json at the repo root — refreshes update that file directly
  without requiring an npm release cycle. Maintained via monthly Perplexity drift check + quarterly
  baseline refresh (Option D — see brief-pricing-maintenance.md).
owner: Sable
status: published

depends_on:
  - name: "Provider pricing pages (Anthropic, OpenAI, Google, Perplexity, DeepSeek)"
    why: "Default pricing table data sourced from first-party documentation. OpenAI cross-referenced from third parties due to 403 on primary page."

depended_on_by:
  - name: "@diabolicallabs/llm-client"
    how: "Optional peer dep — when pricing is configured at createClient(), cost is computed per response via computeCost(). pricing.remoteUrl wires fetchRemoteTable() automatically (v1.7.0+)."
  - name: "@diabolicallabs/agent-sdk"
    how: "Imports LlmCost type for CallRecord.cost field; pricing computed by llm-client layer"
  - name: "Agent Spend Dashboard"
    how: "Consumes CallRecord.cost to display per-call and aggregated cost in the UI"

exports:
  - "computeCost(input: ComputeCostInput): LlmCost"
  - "DEFAULT_PRICING_TABLE: PricingTable — bundled offline fallback, versionedAt field for staleness detection"
  - "fetchRemoteTable(url, options?): Promise<FetchRemoteTableResult> — opt-in remote fetch with stale-while-revalidate cache (v0.2.0+)"
  - "clearPricingCache(url?): void — reset in-memory remote table cache; useful in tests (v0.2.0+)"
  - "Types: LlmCost, ModelPricing, PricingTable, ComputeCostInput, Provider, LlmUsage, FetchRemoteTableOptions, FetchRemoteTableResult"

contracts:
  pricing_table:
    versionedAt: "ISO 8601 date the table was last verified. Consumers check staleness against Date.now()."
    maintenance: "Monthly Perplexity drift check (sonar) + quarterly baseline refresh. See routines/llm-pricing-drift-check.md"
    override: "Consumers pass pricingTable to computeCost() or pricingTable option in createClient() to override defaults."
  remote_fetch:
    source: "pricing/table.json at repo root — canonical remote source served via GitHub raw."
    cache: "In-memory Map keyed by URL. Default TTL: 24h. Override via options.cacheTtlMs."
    fail_safe: "On any failure (network error, HTTP non-2xx, parse error, schema validation failure, 5s timeout) returns DEFAULT_PRICING_TABLE with source:'fallback'. Never throws."
    precedence: "pricing.table (explicit override) > pricing.remoteUrl (remote fetch) > DEFAULT_PRICING_TABLE (bundled fallback)."
  cost_computation:
    anthropic_cache: "cacheCreationTokens billed at cacheWritePer1M (5-min ephemeral). 1-hr tier (cacheWrite1hPer1M) is reserved for future LlmUsage field."
    gemini_tiering: "inputTokens > longContextThreshold selects the elevated rate tier (200k threshold for gemini-3.1-pro-preview and gemini-2.5-pro)."
    deprecated_aliases: "deepseek-chat and deepseek-reasoner emit console.warn on resolution, return deepseek-v4-flash rates."
    isPartial: "True when cost components exist that cannot be computed from LlmUsage: o-series invisible reasoning tokens, sonar-deep-research citation/search fees."

failure_modes:
  - trigger: "Model not in pricing table"
    impact: "computeCost() returns zero cost with isPartial=true. Emits console.warn."
    propagation: "silent — caller receives a result, not an exception"
  - trigger: "Remote fetch failure (network error, HTTP non-2xx, parse/schema error, 5s timeout)"
    impact: "fetchRemoteTable() returns DEFAULT_PRICING_TABLE with source:'fallback'. Logs structured warning."
    propagation: "degraded mode — cost estimates continue from bundled table, never crash LLM requests"
  - trigger: "Perplexity drift check fails (API error, key missing)"
    impact: "pricing:verify exits non-zero with clear error message. Table is NOT modified."
    propagation: "propagated to CLI exit code"
  - trigger: "Pricing table becomes stale (>30 days since versionedAt)"
    impact: "Cost estimates drift from reality. No runtime error."
    propagation: "silent — consumers must check versionedAt themselves or rely on the monthly drift check"

performance:
  expected_latency: "computeCost() is synchronous, pure arithmetic — sub-millisecond."
  expected_latency_remote: "fetchRemoteTable() resolves from in-memory cache in <1ms after first fetch. First fetch: network-bound, 5s connect timeout."
  notes: "pricing:verify makes one Perplexity API call per provider (5 calls total). ~10-30s runtime."

notes: |
  v0.2.0 hybrid storage model: price refreshes update pricing/table.json at the repo root.
  Consumers using pricing.remoteUrl pick up changes on next process restart (no npm release needed).
  Bundled DEFAULT_PRICING_TABLE is updated when table is stale enough to warrant a release.
  Sync script: node pricing/sync-bundled.mjs — regenerates packages/llm-pricing/src/table.ts from table.json.
  Run after any pricing/table.json change and commit both files together.

  DeepSeek v4-pro's promotional discount expired 2026-05-31; table rates reflect the
  post-discount price. The stale promo note was removed from the table.ts generator header
  in the v1.3.0 refresh (PR #218).

  OpenAI pricing sourced from third-party cross-references (primary page 403'd as of 2026-05-13).
  Verify against official OpenAI page at next quarterly refresh.

  pnpm pricing:verify requires PERPLEXITY_API_KEY. Run before merging any pricing table PR.

  v1.3.0 (2026-07-29, PR #218): 9 new model entries — claude-fable-5, claude-opus-5,
  claude-sonnet-5, claude-mythos-5, gpt-5.6-{sol,terra,luna} (hasInvisibleReasoningTokens),
  gemini-3.5-flash-lite, gemini-3.6-flash. All verified live against official provider pages
  2026-07-25. versionedAt bumped to 2026-07-25.

  v1.4.2 (2026-08-18, PR #264): pricing-drift correction sweep across Anthropic,
  OpenAI, DeepSeek, xAI — claude-sonnet-5's planned 2026-08-31 increase cancelled ($2/$10
  stays permanent), claude-haiku-3/3-5 retirement notes, gpt-5.6-terra/luna repriced
  (both had been overpriced in the table), scheduled-shutdown notes for gpt-4.1/o1/o3/
  o3-mini/o4-mini, deepseek-chat/reasoner retirement notes, deepseek-v4-flash/pro moved
  to the new off-peak baseline rate, grok-4.6 added.
  v1.4.3 (PR #268): removed the phantom gemini-3.1-pro pricing row — verified live
  against Google's model docs that only gemini-3.1-pro-preview ever existed; llm-client@6.6.0
  tracks the same correction on the capability-matrix side.

  v1.5.0 (2026-09-05, PR #283): gemini-3.8-flash pricing row added — $0.75 / $3.75 / $0.075
  per 1M input/output/cache-read tokens, same rate as gemini-3.7-flash. Promotional pricing
  for both models ends 2027-01-01, after which the list price rises to $1.50 / $7.50 / $0.15
  per 1M tokens — expect the January drift check to flag this. versionedAt bumped to
  2026-09-05.
